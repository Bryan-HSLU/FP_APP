# Einmaliger Reparatur-Workflow: stellt STATUS.md aus dem letzten guten Stand
# (85a71a3) wieder her und loescht sich danach im selben Commit selbst.
name: repair-status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: STATUS.md wiederherstellen und Workflow entfernen
        run: |
          set -euo pipefail
          git checkout 85a71a32b8e82247d8f21b57b3bfae06137f6ed6 -- STATUS.md
          git rm -q .github/workflows/repair-status.yml
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git commit -q -F - <<'MSG'
          STATUS.md wiederhergestellt (Stand der Parallel-Sessions, 85a71a3)

          Eine Session auf veraltetem Checkout hatte STATUS.md mit der
          Juni-Fassung ueberschrieben; damit fehlten die Eintraege zu
          Kurator v3/v3.2, den Wellen A-D, UI, Begehbarkeit hart am Planende
          und den LLM-Laeufen. Der Code war nie betroffen - nur diese Datei.

          Die Performance-Messwerte der ueberschreibenden Fassung werden
          bewusst nicht wieder eingefuegt: sie stammen vom Juni-Stand und
          waeren gegenueber dem heutigen Code irrefuehrend.

          Der temporaere Reparatur-Workflow entfernt sich hier selbst.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_017PW7Qr3Gotr4yH86Q1zEcH
          MSG
          git push origin HEAD:main
