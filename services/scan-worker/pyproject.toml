[project]
name = "fp-scan-worker"
version = "0.1.0"
description = "Future Planning POC – GPU-Scan-Worker (Colab/T4): AR-Posen + Video → known-pose Tiefen-Fusion → z-up .ply → SpatialLM → layout.txt. Geometrie-Kern CPU-only (numpy)."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
]

[project.optional-dependencies]
# Nur für den lauffähigen Worker auf Colab nötig – der Geometrie-Kern (und die
# Tests) brauchen kein Gradio. torch/spatiallm/depth-anything sind bewusst KEINE
# Dependencies (NC-Lizenz SpatialLM, nur Colab) und werden dort separat installiert.
worker = [
    "gradio>=5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fp_scan_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pyflakes/pycodestyle + Import-Sortierung + Bugbear + Upgrades
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

# GPU-/Colab-only-Bausteine ohne (installierte) Typ-Stubs: guarded Imports im
# Code, hier nur die fehlenden Stubs stummschalten.
[[tool.mypy.overrides]]
module = ["open3d.*", "gradio.*", "cv2.*", "torch.*", "transformers.*", "PIL.*"]
ignore_missing_imports = true
